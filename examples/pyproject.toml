[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempr-examples"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "langchain>=1.0,<2", "langchain-openai>=1.0,<2", "python-dotenv>=1.0,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["tempr*", "shared*", "task_manager*"]
exclude = ["tests*"]
